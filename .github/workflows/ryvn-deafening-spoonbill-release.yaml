name: Build & Release deafening-spoonbill

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: deafening-spoonbill
    permissions:
      contents: write
      id-token: write
    secrets:
      RYVN_CLIENT_ID: ${{ secrets.RYVN_CLIENT_ID }}
      RYVN_CLIENT_SECRET: ${{ secrets.RYVN_CLIENT_SECRET }}
